<!doctype html><html lang="en"><meta charset="utf-8"><title>Marque — film storyboard</title>
<style>
@font-face{font-family:Geist;src:url(../assets/geist.woff2)}@font-face{font-family:Mono;src:url(../assets/geist-mono.woff2)}@font-face{font-family:Fraunces;src:url(../assets/fraunces.woff2)}
*{box-sizing:border-box}html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#edede7;color:#15160f;font-family:Geist,sans-serif}#frame{position:relative;width:1920px;height:1080px;padding:64px 96px}.dark{background:#12140e;color:#e8e9e0}.top{display:flex;align-items:center;justify-content:space-between;font-size:21px;color:#5c5e52}.dark .top{color:#a4a697}.logo{width:170px;height:auto}.phase{display:flex;align-items:center;gap:18px}.phase:before{content:'';width:44px;height:3px;background:#b0892c}h1{font-family:Fraunces;font-variation-settings:'SOFT' 10,'WONK' 0;font-weight:450;font-size:110px;line-height:1.07;letter-spacing:-4px;margin:0;white-space:pre-line}.stage{position:absolute;top:183px;left:96px;right:96px;height:602px}.number{font-family:Mono;font-size:230px;letter-spacing:-13px;font-weight:450;line-height:1}.sub{font-size:30px;line-height:1.45;color:#5c5e52;margin-top:22px}.dark .sub{color:#b2b5a5}.small{font-size:23px;line-height:1.45;color:#5c5e52}.dark .small{color:#a4a697}.rule{height:4px;background:#d4d4cb;position:relative;margin-top:50px}.rule:after{content:'';position:absolute;height:36px;width:4px;right:19%;top:-16px;background:#b0892c}.rule .fill{width:67%;height:4px;background:#15160f}.dark .rule{background:#2c3023}.dark .rule .fill{background:#e8e9e0}.bottom{position:absolute;bottom:0;left:0;right:0;height:237px;padding:28px 96px;background:#e1e1d9;border-top:1px solid #cacbc0}.dark .bottom{background:#1b1e15;border-color:#2c3023}.vo{font-size:31px;line-height:1.42;max-width:1710px;margin-top:17px}.meta{display:flex;justify-content:space-between;font-size:18px;color:#5c5e52}.dark .meta{color:#a4a697}.split{display:grid;grid-template-columns:1fr 1fr;gap:92px}.split h1{font-size:90px}.metric{border-top:1px solid #bfc1b4;padding-top:30px}.metric b{font-family:Mono;font-size:125px;font-weight:450;letter-spacing:-8px}.metric p{font-size:28px;max-width:490px;line-height:1.45}.source{position:absolute;bottom:0;left:0;right:0;font-size:20px;color:#5c5e52;display:flex;justify-content:space-between}.dark .source{color:#a4a697}.product-head{font-family:Fraunces;font-size:64px;letter-spacing:-1.6px;margin-bottom:25px;line-height:1.1}.crop{width:1728px;height:456px;overflow:hidden;border:1px solid #d4d4cb;position:relative;background:#f3f1e8}.crop img{position:absolute;width:2200px;max-width:none;left:-245px}.caption-tag{position:absolute;right:16px;bottom:16px;background:#edede7;border:1px solid #bfc1b4;padding:8px 12px;font-size:17px}.scope-list{margin-top:0}.scope-list div{border-top:1px solid #2c3023;padding:18px 0;font-size:35px;display:flex;justify-content:space-between}.scope-list em{font-size:21px;font-style:normal;color:#a4a697;align-self:center}.pill{border:1px solid #747868;padding:9px 14px;font-size:19px;display:inline-block;margin-top:32px}.range-box{border-top:1px solid #c4c7b8;padding-top:20px;margin-top:34px}.range-title{display:flex;justify-content:space-between;font-size:25px}.range-track{position:relative;margin:46px 0 40px;height:4px;background:#d4d4cb}.range-band{position:absolute;top:-12px;height:28px;background:#2e735130;border:1px solid #2e7351}.tick{position:absolute;top:-23px;height:50px;width:3px;background:#15160f}.range-labels{display:flex;justify-content:space-between;font-family:Mono;font-size:22px}.proof-num{font-family:Mono;font-size:84px;letter-spacing:-4px}.evidence-table{border-top:1px solid #bfc1b4;margin-top:32px}.evidence-table div{display:flex;justify-content:space-between;align-items:center;padding:24px 0;border-bottom:1px solid #d4d4cb;font-size:29px}.evidence-table code{font-family:Mono;font-size:25px}.url{font-size:53px;margin-top:55px;letter-spacing:-1px}.zero{font-size:430px;line-height:.91;letter-spacing:-34px}.state-bad{color:#a83a2c}.stamp{border:1px solid #bfc1b4;font-size:19px;padding:10px 16px;display:inline-block;margin-top:20px}.footer-rule{position:absolute;left:96px;right:96px;bottom:244px;height:3px;background:#b0892c;transform-origin:left}
.bottom{height:145px;padding:20px 96px;background:transparent!important;border:0}.vo{display:none}.meta{font-size:20px}.meta #time{display:none}.footer-rule{display:none}.stage{height:700px}.source{bottom:0}.crop{height:545px}.caption-tag{display:none}.stamp{display:none}</style>
<div id="frame"><div class="top"><img class="logo" id="logo"><div class="phase" id="chapter"></div><div>Before you give it authority</div></div><div class="stage" id="stage"></div><div class="footer-rule" id="progress"></div><div class="bottom"><div class="meta"><span id="kind"></span><span id="time"></span></div><div class="vo" id="vo"></div></div></div>
<script>
const esc=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');
const h=(title,sub='')=>`<h1>${esc(title)}</h1>${sub?`<div class="sub">${esc(sub)}</div>`:''}`;
const foot=(a,b='')=>`<div class="source"><span>${a}</span><span>${b}</span></div>`;
const rule=()=>'<div class="rule"><div class="fill"></div></div>';
const crop=(name,top)=>`<div class="crop"><img src="../recon/${name}.png" style="top:${top}px"><span class="caption-tag">Actual product / scouting still</span></div>`;
window.renderBoard=(s,index,all,facts)=>{
 const dark=['charter'].includes(s.id);document.querySelector('#frame').className=dark?'dark':'';
 document.querySelector('#logo').src=`../assets/lockup-${dark?'cream':'ink'}.png`;
 document.querySelector('#chapter').textContent=s.chapter;document.querySelector('#vo').textContent=s.vo;
 document.querySelector('#kind').textContent=s.kind;const start=all.slice(0,index).reduce((a,b)=>a+b.duration,0);const tc=t=>Math.floor(t/60)+':'+String(t%60).padStart(2,'0');
 document.querySelector('#time').textContent=`${tc(start)}—${tc(start+s.duration)} / provisional picture timing`;
 document.querySelector('#progress').style.transform=`scaleX(${(start+s.duration)/160})`;
 let html='';
 switch(s.id){
 case 'question':html=h(s.title,'What should it have to prove?')+rule()+foot('A marketplace for agents you can hold to account.','Permission starts at the boundary.');break;
 case 'population':html=`<div class="number">${facts.funnel.stages[0].count.toLocaleString('en-US')}</div><div class="sub">${s.subtitle}</div>`+rule()+foot('Indexed registrations ≠ unique operators','Source: marque.trade/api/v1/funnel');break;
 case 'sample':html=`<div class="split"><div><div class="number">${facts.standard.thirdPartyRuns}</div><div class="sub">${s.subtitle}</div><div class="stamp">Published MCS tests / recorded runs</div></div><div style="padding-top:25px">${h('Can it answer\nthe task?')}<p class="sub">Different question.<br>Different population.</p></div></div>`+foot('Sample-specific evidence','Source: marque.trade/standard');break;
 case 'zero':html=`<div class="split"><div class="number zero">0</div><div style="padding-top:95px">${h('Passes.')}<p class="sub">In these 684 test runs.</p><div class="stamp">1.5 seconds of silence before the line</div></div></div>`+foot('No ecosystem-wide inference','Source: marque.trade/standard');break;
 case 'scope':html=`<div class="split"><div class="metric"><b>501</b><p>Could not answer through an addressable interface.</p><span class="small">Measured / published no-answer count</span></div><div class="metric"><b>183</b><p>Remaining runs.<br>No pass recorded.</p><span class="small">Derived / 684 total − 501 no-answer</span></div></div>`+foot('A failure to answer and a wrong answer are different facts.','Source: marque.trade/standard');break;
 case 'title':html=`<img src="../assets/mark-ink.png" style="width:140px;height:auto;margin-bottom:37px">`+h(s.title)+foot('A marketplace built around the evidence.','marque.trade');break;
 case 'read':html=`<div class="product-head">${esc(s.title.replace('\n',' '))}</div>`+crop('positions',-570)+foot('Paste an address / read chain / inspect provenance','Final take will preserve its own block.');break;
 case 'find':html=`<div class="product-head">${esc(s.title.replace('\n',' '))}</div>`+crop('register',-970)+foot('Filter / compare / preview','Reference supply stays visibly labelled.');break;
 case 'test':html=`<div class="split"><div>${h(s.title)}<p class="sub">Facts and supplied policy.<br>Published tolerances.</p></div><div class="evidence-table"><div><code>currentTick</code><span>exact</span></div><div><code>proposedTickSpacing</code><span>must hold</span></div><div><code>amounts</code><span>±0.5%</span></div><div><code>slippageBound</code><span>must be stated</span></div><p class="small">Editorial excerpt of MCS-REB-1.<br>Final film pairs this with actual result evidence.</p></div></div>`+foot('Not a grade of investment judgement.','marque.trade/standard/MCS-REB-1');break;
 case 'charter':html=`<div class="split"><div>${h(s.title)}<p class="sub">A bounded signing path.</p><span class="pill">Demonstration on BSC testnet 97</span></div><div class="scope-list"><div>Contracts<em>allowlisted</em></div><div>Functions<em>explicit</em></div><div>Spending<em>capped</em></div><div>Time<em>expires</em></div><div>Permission<em>revocable</em></div></div></div>`+foot('Planned: actual grant, confirmation and revoke.','No transaction is claimed by this board.');break;
 case 'receipt':html=`<div class="split"><div>${h(s.title)}<p class="sub">Open the evidence.</p></div><div class="scope-list"><div>Quoted</div><div>Permitted</div><div>Executed</div><div>Produced</div></div></div>`+foot('Planned: one real archived receipt.','Source selection pending final capture.');break;
 case 'proof':html=`<div class="split"><div>${h(s.title)}<p class="sub">PancakeSwap V3<br>Archived mainnet demonstration</p><div style="margin-top:30px"><span class="proof-num">$60</span><span style="font-size:25px;margin-left:24px">spending cap</span></div></div><div><div class="range-box"><div class="range-title"><span>Before</span><span class="state-bad">Out of range</span></div><div class="range-track"><div class="range-band" style="left:72%;width:3%;background:#a83a2c22;border-color:#a83a2c"></div><div class="tick" style="left:58%"></div></div><div class="range-labels"><span>tick −66091</span><span>[−66078, −66076]</span></div></div><div class="range-box"><div class="range-title"><span>After</span><span style="color:#2e7351">In range</span></div><div class="range-track"><div class="range-band" style="left:13%;width:73%"></div><div class="tick" style="left:50%"></div></div><div class="range-labels"><span>tick −66090</span><span>[−66135, −66045]</span></div></div><p class="small">Schematic / separate scales.<br>Deliberately narrow setup; not a customer rescue.</p></div></div>`+foot('Source: recorded mainnet proof / 8 September 2026','marque.trade/pancakeswap/proof');break;
 case 'ledger':html=`<div class="product-head">${esc(s.title.replace('\n',' '))}</div>`+crop('ledger',-250)+foot('No same-block speed or quality victory is claimed.','marque.trade/ledger');break;
 case 'close':html=h(s.title)+`<div class="url">marque.trade</div>`+rule()+foot('Agents you can hold to account.','Final URL hold: four seconds');break;
 }
 document.querySelector('#stage').innerHTML=html;
};

const originalRender=window.renderBoard;
window.renderFilm=(s,i,scenes,facts)=>{
 originalRender(s,i,scenes,facts);
 document.querySelector('#vo').textContent='';document.querySelector('.top>div:last-child').textContent=s.kind;document.querySelector('.top>div:last-child').style.fontSize='17px';document.querySelector('.bottom').style.display='none';
 document.querySelector('#kind').textContent=s.kind+' / 9 September 2026';
 const source=document.querySelector('.source');if(source)source.innerHTML='<span>'+(['population','sample','zero','scope'].includes(s.id)?'Recorded evidence / 9 September 2026':'marque.trade')+'</span>';
 if(s.id==='test'){document.querySelector('.evidence-table .small').textContent='Published MCS-REB-1 checks';}
 if(s.id==='charter'){document.querySelector('#stage').innerHTML='<div class="product-head">Permission has an edge.</div><div class="crop"><img src="captures/charter.png" style="width:1900px;left:-86px;top:-400px"></div>';}
 if(s.id==='receipt'){document.querySelector('#stage').innerHTML='<div class="product-head">The run leaves a record.</div><div class="crop" style="height:566px;background:#f3f1e8"><img src="captures/receipt-grid.png" style="width:1728px;left:0;top:0"><span class="caption-tag">Actual product / archived receipt</span></div>';}
 if(s.id==='close')document.querySelector('.source').innerHTML='<span>Agents you can hold to account.</span>';
};
</script></html>
