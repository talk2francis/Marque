name: CI

on:
  push:
    branches: [main, phase2]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: marque
          POSTGRES_DB: marque
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:marque@localhost:5432/marque
      MARQUE_CLAIM_SECRET: ci-only-not-a-secret
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migrate an empty database
        run: pnpm db:migrate
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm lint:copy
      - name: Deployment transport and cached-client assets
        run: |
          bash -n scripts/deploy-web.sh
          bash ops/http-health.test.sh
          node --test scripts/lib/previous-assets.check.mjs
      - run: pnpm test
      - name: Create the guarded integration fixture database
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: marque
        run: createdb marque_vnext_fixture_ci
      - name: Migrate the isolated integration fixture
        env:
          DATABASE_URL: postgres://postgres:marque@localhost:5432/marque_vnext_fixture_ci
        run: pnpm db:migrate
      - name: Listing, seller, hire and feedback database regressions
        env:
          MARQUE_INTEGRATION_DB: postgres://postgres:marque@localhost:5432/marque_vnext_fixture_ci
        run: >-
          pnpm exec vitest run
          apps/web/lib/listing.integration.test.ts
          apps/web/lib/seller.integration.test.ts
          packages/commerce/src/hire-p02.integration.test.ts
          packages/commerce/src/feedback-proof.integration.test.ts
          apps/web/lib/marketplace-scope.integration.test.ts
          apps/web/lib/agent-state.integration.test.ts
          packages/commerce/src/latest-quote.integration.test.ts
          --maxWorkers=1 --minWorkers=1
      - name: Build the web app
        run: pnpm --filter @marque/web build

  smoke:
    name: Smoke (home, marketplace, storefront, quest; no wallet)
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          # v5 enables caching from package.json's packageManager (pnpm) by default;
          # this job only needs Playwright, installed outside the workspace below.
          package-manager-cache: false
      # Outside the pnpm workspace: npm cannot install into a workspace root.
      - name: Install Playwright
        run: |
          mkdir -p "$RUNNER_TEMP/smoke" && cp scripts/ci-smoke.mjs "$RUNNER_TEMP/smoke/"
          cd "$RUNNER_TEMP/smoke" && npm init -y >/dev/null && npm install --no-audit --no-fund playwright@1
          npx playwright install --with-deps chromium
      - name: Smoke the live site
        env:
          SMOKE_BASE: https://marque.trade
        run: node "$RUNNER_TEMP/smoke/ci-smoke.mjs"
